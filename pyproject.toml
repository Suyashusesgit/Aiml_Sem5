[tool.pyrefly]
disable-search-path-heuristics = true
search-path = [".", "src"]

project-includes = [
    "src/**",
    "scripts/**",
    "tests/**",
    "app.py",
    "main.py"
]

project-excludes = [
    "notebooks/**",
    "**/*.ipynb",
    "report/**",
    "data/**",
    "results/**",
    "**/.ipynb_checkpoints/**",
    "**/__pycache__/**"
]

[tool.pyrefly.errors]
untyped-import = "ignore"
